version: 2.1

executors:
  vm-builder:
    machine:
      # We use the VM to host the Docker engine and provide Kernel/Mount permissions
      image: ubuntu-2204:current
    # Downgraded to 'large' to fit standard plans
    resource_class: large
    environment:
      SRC_DIR: /home/circleci/project

jobs:
  build-r8q:
    executor: vm-builder
    steps:
      # 1. Host Setup: Checkout Code (Shallow Clone for Speed)
      - run:
          name: Checkout Code
          command: |
            # Clean up previous runs
            rm -rf ./* ./.??*
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # Clone latest commit only
            git clone --depth 1 --branch $CIRCLE_BRANCH $CIRCLE_REPOSITORY_URL .

            # Initialize submodules shallowly
            git submodule sync
            git submodule update --init --recursive --depth 1

      # 2. The Build Step: Docker inside VM
      # We run Ubuntu 24.04 inside the VM to get modern dependencies (Protobuf/Fmt).
      # We use --privileged so the build script can mount firmware images.
      - run:
          name: Build in Ubuntu 24.04 (Docker)
          no_output_timeout: 60m
          command: |
            docker pull ubuntu:24.04

            docker run --privileged --rm -v $(pwd):/work -w /work ubuntu:24.04 bash -c '

              # A. Install Dependencies (Ubuntu 24.04 versions)
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -yq \
                sudo git curl unzip 7zip attr ccache clang ffmpeg \
                libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
                libzstd-dev lld protobuf-compiler webp \
                python3 python3-venv python-is-python3 openjdk-17-jdk \
                lz4 liblz4-tool aria2 android-sdk-libsparse-utils \
                erofs-utils f2fs-tools && \

              # B. Configure Git (FIXED: Allow all directories to prevent "dubious ownership")
              git config --global user.name "circleci-bot" && \
              git config --global user.email "bot@example.com" && \
              git config --global --add safe.directory "*" && \

              # C. Build Dependencies
              source ./buildenv.sh r8q && \
              ./scripts/build_dependencies.sh && \

              # D. Download & Extract Firmware
              ./scripts/download_fw.sh && \
              ./scripts/extract_fw.sh && \

              # E. Compile ROM
              ./scripts/make_rom.sh --no-rom-zip && \

              # F. Fix permissions so the Host VM can read the output files
              chmod -R 777 out/
            '

      # 3. Artifacts: Prepare files for upload
      - run:
          name: Prepare Artifacts
          command: |
            mkdir -p /tmp/artifacts
            # Copy images (system.img, etc.)
            find out/ -name "*.img" -exec cp {} /tmp/artifacts/ \;
            # Copy zip if it exists (ignore error if not)
            find out/ -name "*.zip" -exec cp {} /tmp/artifacts/ \; || true

      # 4. Upload to CircleCI
      - store_artifacts:
          name: Upload ROM
          path: /tmp/artifacts
          destination: rom_build

workflows:
  build-r8q-workflow:
    jobs:
      - build-r8q

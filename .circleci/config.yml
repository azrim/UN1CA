version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:24.04
    resource_class: large

    environment:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # -----------------------------------------------------
      # PRECHECKOUT: install git + ssh and trust GitHub host
      # -----------------------------------------------------
      - run:
          name: Install Git & SSH
          command: |
            apt-get update
            apt-get install -y git openssh-client

      - run:
          name: Add GitHub to known_hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

      # -----------------------------------------------------
      # FAST CHECKOUT (shallow clone + shallow submodules)
      # -----------------------------------------------------
      - run:
          name: Checkout repository
          command: |
            git clone --depth=1 --branch "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL" .
            git submodule update --init --recursive --depth 1 || true

      # -----------------------------------------------------
      # BUILD ENVIRONMENT SETUP
      # -----------------------------------------------------
      - run:
          name: Install build dependencies
          command: |
            apt-get update
            apt-get install -yq \
              7zip attr ccache clang ffmpeg \
              libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
              libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
              curl unzip wget python3 python3-venv openjdk-17-jdk

            # kernel modules may fail inside docker; ignore
            modprobe erofs || true
            modprobe f2fs || true

            git config --global user.name "circleci-bot"
            git config --global user.email "bot@example.com"

      # -----------------------------------------------------
      # BUILD SEQUENCE (same as GitHub Actions)
      # -----------------------------------------------------
      - run:
          name: Build dependencies
          command: |
            source ./buildenv.sh r8q
            ./scripts/build_dependencies.sh

      - run:
          name: Download firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/download_fw.sh

      - run:
          name: Extract firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/extract_fw.sh

      - run:
          name: Build ROM
          no_output_timeout: 90m
          command: |
            source ./buildenv.sh r8q
            ./scripts/make_rom.sh --no-rom-zip

      # -----------------------------------------------------
      # ARTIFACT UPLOAD
      # -----------------------------------------------------
      - store_artifacts:
          path: out/
          destination: rom_output

workflows:
  build-workflow:
    jobs:
      - build

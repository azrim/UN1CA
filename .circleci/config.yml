version: 2.1

executors:
  vm-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      SRC_DIR: /home/circleci/project

jobs:
  build-r8q:
    executor: vm-builder
    steps:
      # 1. Restore cache (git submodules + dependencies)
      - restore_cache:
          key: r8q-cache-{{ .Branch }}-{{ checksum "scripts/build_dependencies.sh" }}

      # 2. Fresh checkout
      - run:
          name: Checkout Code
          command: |
            rm -rf ./* ./.??*
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone --depth 1 --branch $CIRCLE_BRANCH $CIRCLE_REPOSITORY_URL .
            git submodule sync
            git submodule update --init --recursive --depth 1
            git config --global --add safe.directory "*"

      # 3. Pull prebuilt Docker image (already has all deps)
      - run:
          name: Pull Prebuilt Android Build Image
          command: |
            docker pull ghcr.io/yourname/android-rom-base:latest

      # 4. ROM build using prebuilt image
      - run:
          name: Build ROM (fast)
          no_output_timeout: 60m
          command: |
            docker run --privileged --rm \
              -v $(pwd):/work -w /work \
              ghcr.io/yourname/android-rom-base:latest \
              bash -c '
                git config --global user.name "circleci-bot"
                git config --global user.email "bot@example.com"

                # Force bundled fmt
                sed -i "s/ANDROID_TOOLS_USE_BUNDLED_FMT=OFF/ANDROID_TOOLS_USE_BUNDLED_FMT=ON/g" scripts/build_dependencies.sh

                source ./buildenv.sh r8q

                ./scripts/build_dependencies.sh
                ./scripts/download_fw.sh
                ./scripts/extract_fw.sh
                ./scripts/make_rom.sh --no-rom-zip

                chmod -R 777 out/
              '

      # 5. Save cache after dependencies built
      - save_cache:
          key: r8q-cache-{{ .Branch }}-{{ checksum "scripts/build_dependencies.sh" }}
          paths:
            - build/.ccache
            - .git/modules

      # 6. Extract artifacts
      - run:
          name: Prepare Artifacts
          command: |
            mkdir -p /tmp/artifacts
            find out/ -name "*.img" -exec cp {} /tmp/artifacts/ \;
            find out/ -name "*.zip" -exec cp {} /tmp/artifacts/ \; || true

      - store_artifacts:
          name: Upload ROM
          path: /tmp/artifacts
          destination: rom_build

workflows:
  build-r8q-workflow:
    jobs:
      - build-r8q

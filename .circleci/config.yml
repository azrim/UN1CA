version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:24.04
    resource_class: large

    environment:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - checkout

      - run:
          name: Free disk space (1/3)
          command: |
            apt-get update
            apt-get install -y sudo docker.io
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force || true
            sudo docker builder prune -a || true

      - run:
          name: Free disk space (2/3)
          command: |
            echo "Skipping jlumbroso/free-disk-space equivalent (not required on CircleCI)"

      - run:
          name: Free disk space (3/3)
          command: |
            echo "Skipping slimhub_actions equivalent (CircleCI doesn't need this)"

      - run:
          name: Set up build environment
          command: |
            apt-get update
            apt-get install -yq \
              7zip attr ccache clang ffmpeg \
              libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
              libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
              git curl unzip wget python3 python3-venv openjdk-17-jdk

            modprobe erofs || true
            modprobe f2fs || true

            git config --global user.name "circleci-bot"
            git config --global user.email "bot@example.com"

            echo "${PLATFORM_KEY_PK8}" | base64 -d > security/unica_platform.pk8
            echo "${PLATFORM_KEY_PEM}" | base64 -d > security/unica_platform.x509.pem

      - run:
          name: Build dependencies
          command: |
            source ./buildenv.sh r8q
            ./scripts/build_dependencies.sh

      - run:
          name: Download stock firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/download_fw.sh

      - run:
          name: Extract stock firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/extract_fw.sh

      - run:
          name: Build ROM
          command: |
            source ./buildenv.sh r8q
            ./scripts/make_rom.sh --no-rom-zip

      - store_artifacts:
          path: out/
          destination: rom_output

workflows:
  version: 2
  build-workflow:
    jobs:
      - build

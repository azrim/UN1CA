version: 2.1

executors:
  vm-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      SRC_DIR: /home/circleci/project

jobs:
  prepare-env:
    executor: vm-builder
    steps:
      - restore_cache:
          key: apt-cache-{{ checksum "apt-packages.txt" }}

      - run:
          name: Checkout Code
          command: |
            rm -rf ./* ./.??*
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone --depth 1 --branch $CIRCLE_BRANCH $CIRCLE_REPOSITORY_URL .
            git submodule update --init --recursive --depth 1
            git config --global --add safe.directory "*"

      - run:
          name: Install APT Dependencies (cached)
          command: |
            docker pull ubuntu:24.04
            mkdir -p /home/circleci/apt-cache /home/circleci/apt-lib

            docker run --privileged --rm \
              -v /home/circleci/apt-cache:/var/cache/apt \
              -v /home/circleci/apt-lib:/var/lib/apt \
              -v $(pwd):/work -w /work \
              ubuntu:24.04 bash -c "
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -yq \$(cat apt-packages.txt)
              "

      - save_cache:
          key: apt-cache-{{ checksum "apt-packages.txt" }}
          paths:
            - /home/circleci/apt-cache
            - /home/circleci/apt-lib

      - persist_to_workspace:
          root: .
          paths:
            - .

  build-rom:
    executor: vm-builder
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Build ROM (fresh run)
          no_output_timeout: 60m
          command: |
            docker run --privileged --rm \
              -v $(pwd):/work -w /work ubuntu:24.04 bash -c '
                git config --global user.name "circleci-bot"
                git config --global user.email "bot@example.com"

                sed -i "s/ANDROID_TOOLS_USE_BUNDLED_FMT=OFF/ANDROID_TOOLS_USE_BUNDLED_FMT=ON/g" scripts/build_dependencies.sh

                source ./buildenv.sh r8q

                ./scripts/build_dependencies.sh
                ./scripts/download_fw.sh
                ./scripts/extract_fw.sh
                ./scripts/make_rom.sh --no-rom-zip

                chmod -R 777 out/
              '

      # this ONLY runs if the job was successful
      - save_cache:
          key: build-cache-r8q-{{ .Revision }}
          paths:
            - out/

      - run:
          name: Prepare Artifacts
          command: |
            mkdir -p /tmp/artifacts
            find out/ -name "*.img" -exec cp {} /tmp/artifacts/ \;
            find out/ -name "*.zip" -exec cp {} /tmp/artifacts/ \; || true

      - store_artifacts:
          path: /tmp/artifacts
          destination: rom_build

workflows:
  build-r8q-workflow:
    jobs:
      - prepare-env
      - build-rom:
          requires:
            - prepare-env

version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:24.04
    resource_class: large
    environment:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - run:
          name: Install Git & SSH
          command: |
            apt-get update
            apt-get install -y git openssh-client

      - run:
          name: Trust GitHub Host
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

      - run:
          name: Checkout (shallow)
          command: |
            git clone --depth=1 --branch "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL" .
            git submodule update --init --recursive --depth 1 || true

      - run:
          name: Install full dependencies
          command: |
            apt-get update
            apt-get install -yq \
              7zip p7zip-full unzip zip \
              attr rsync \
              clang lld ccache make cmake ninja-build \
              ffmpeg webp libwebp-dev \
              pkg-config \
              git curl wget \
              python3 python3-venv python-is-python3 \
              openjdk-17-jdk \
              libbrotli-dev libgtest-dev libprotobuf-dev protobuf-compiler \
              libunwind-dev libpcre2-dev libssl-dev zlib1g-dev libzstd-dev \
              libusb-1.0-0-dev \
              linux-modules-extra-$(uname -r) \
              android-sdk-libsparse-utils \
              erofs-utils f2fs-tools \
              vim-common \
              lz4 liblz4-tool liblz4-dev \
              xxd

            modprobe erofs || true
            modprobe f2fs || true

            git config --global user.name "circleci-bot"
            git config --global user.email "bot@example.com"

      - run:
          name: Build dependencies
          command: |
            source ./buildenv.sh r8q
            ./scripts/build_dependencies.sh

      - run:
          name: Download firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/download_fw.sh

      - run:
          name: Extract firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/extract_fw.sh

      - run:
          name: Build ROM
          no_output_timeout: 120m
          command: |
            source ./buildenv.sh r8q
            ./scripts/make_rom.sh --no-rom-zip

      - store_artifacts:
          path: out/
          destination: rom_output

workflows:
  build-workflow:
    jobs:
      - build

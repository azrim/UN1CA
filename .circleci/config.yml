version: 2.1

executors:
  vm-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      SRC_DIR: /home/circleci/project
      _JAVA_OPTIONS: "-Xmx4g"
      USE_CCACHE: 1
      CCACHE_DIR: /home/circleci/.ccache

jobs:
  build-r8q:
    executor: vm-builder
    steps:
      - run:
          name: Checkout Code (Shallow)
          command: |
            rm -rf ./* ./.??*
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone --depth 1 --branch $CIRCLE_BRANCH $CIRCLE_REPOSITORY_URL .
            git submodule sync
            git submodule update --init --recursive --depth 1

      - run:
          name: Install System Dependencies
          command: |
            sudo apt-get update
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
              build-essential pkg-config cmake \
              7zip attr ccache clang ffmpeg git curl unzip \
              libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
              libzstd-dev linux-modules-extra-$(uname -r) lld webp \
              python3 python3-venv python-is-python3 openjdk-17-jdk \
              lz4 liblz4-tool aria2 android-sdk-libsparse-utils \
              liblz4-dev libusb-1.0-0-dev libssl-dev zlib1g-dev

      # [NEW STEP] Manually install newer tools needed for Android source
      - run:
          name: Install Modern Dependencies (Protobuf & Fmt)
          command: |
            # 1. Install Protoc 25.1 (Fixes "optional fields" error)
            echo "Installing Protoc 25.1..."
            curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip
            sudo unzip -o protoc-25.1-linux-x86_64.zip -d /usr/local bin/protoc
            sudo unzip -o protoc-25.1-linux-x86_64.zip -d /usr/local 'include/*'
            sudo chmod +x /usr/local/bin/protoc

            # 2. Compile fmt 9.1.0 (Fixes "fmt/std.h not found" error)
            echo "Compiling libfmt 9.1.0..."
            git clone --depth 1 --branch 9.1.0 https://github.com/fmtlib/fmt.git
            cd fmt
            mkdir build && cd build
            cmake -DCMAKE_POSITION_INDEPENDENT_CODE=TRUE -DFMT_TEST=OFF ..
            make -j$(nproc)
            sudo make install
            cd ../.. && rm -rf fmt

      - restore_cache:
          name: Restore Build Cache
          keys:
            - v5-cache-{{ checksum "scripts/utils/build_utils.sh" }}-{{ checksum "external/android-tools/CMakeLists.txt" }}

      - run:
          name: Build Dependencies
          command: |
            export PATH="/usr/lib/ccache:$PATH"
            export MAKEFLAGS="-j$(nproc)"
            bash -lc 'source ./buildenv.sh r8q && ./scripts/build_dependencies.sh'

      - save_cache:
          name: Save Build Cache
          key: v5-cache-{{ checksum "scripts/utils/build_utils.sh" }}-{{ checksum "external/android-tools/CMakeLists.txt" }}
          paths:
            - out/tools
            - out/host
            - /home/circleci/.ccache

      - run:
          name: Download & Extract Firmware
          no_output_timeout: 40m
          command: |
            bash -lc 'source ./buildenv.sh r8q && ./scripts/download_fw.sh'
            bash -lc 'source ./buildenv.sh r8q && ./scripts/extract_fw.sh'

      - run:
          name: Build ROM
          no_output_timeout: 60m
          command: |
            bash -lc 'source ./buildenv.sh r8q && ./scripts/make_rom.sh --no-rom-zip'

      - run:
          name: Prepare Artifacts
          command: |
            mkdir -p /tmp/artifacts
            find out/ -name "*.img" -exec cp {} /tmp/artifacts/ \;
            find out/ -name "*.zip" -exec cp {} /tmp/artifacts/ \; || true

      - store_artifacts:
          name: Upload ROM
          path: /tmp/artifacts
          destination: rom_build

workflows:
  build-r8q-workflow:
    jobs:
      - build-r8q

version: 2.1

executors:
  vm-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /home/circleci/.ccache
      CCACHE_MAXSIZE: 10G

jobs:
  prepare-env:
    executor: vm-builder
    steps:
      # Restore apt + ccache + build caches
      - restore_cache:
          key: apt-cache-{{ checksum ".circleci/apt-packages.txt" }}
      - restore_cache:
          key: ccache-{{ .Branch }}
      - restore_cache:
          key: incremental-out-{{ .Branch }}-{{ checksum "scripts" }}

      - run:
          name: Checkout Code
          command: |
            git clone --depth 1 --branch "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL" .
            git submodule sync
            git submodule update --init --recursive --depth 1
            git config --global --add safe.directory "*"

      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            grep -Ev '^\s*(#|$)' .circleci/apt-packages.txt | xargs sudo apt-get install -yq

      - run:
          name: Initialize ccache
          command: |
            mkdir -p "$CCACHE_DIR"
            ccache --set-config=max_size=$CCACHE_MAXSIZE
            ccache --zero-stats || true

      - save_cache:
          key: apt-cache-{{ checksum ".circleci/apt-packages.txt" }}
          paths:
            - /var/cache/apt
            - /var/lib/apt

      - persist_to_workspace:
          root: .
          paths:
            - .

  build-deps:
    executor: vm-builder
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Build Dependencies (ccache enabled)
          command: |
            git config --global user.name "circleci-bot"
            git config --global user.email "bot@example.com"

            sed -i 's/ANDROID_TOOLS_USE_BUNDLED_FMT=OFF/ANDROID_TOOLS_USE_BUNDLED_FMT=ON/' scripts/build_dependencies.sh

            source ./buildenv.sh r8q
            export CC="ccache clang"
            export CXX="ccache clang++"

            ./scripts/build_dependencies.sh

      - save_cache:
          key: ccache-{{ .Branch }}
          paths:
            - /home/circleci/.ccache

      - persist_to_workspace:
          root: .
          paths:
            - out/deps

  extract-firmware:
    executor: vm-builder
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Fetch & Extract Firmware
          command: |
            ./scripts/download_fw.sh
            ./scripts/extract_fw.sh

      - persist_to_workspace:
          root: .
          paths:
            - out/firmware

  build-rom:
    executor: vm-builder
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Compile ROM (fast, incremental-safe)
          no_output_timeout: 120m
          command: |
            source ./buildenv.sh r8q
            export CC="ccache clang"
            export CXX="ccache clang++"

            # incremental builds restored if safe
            if [ -d out ] ; then
              echo "Restoring incremental build output..."
            else
              mkdir -p out
            fi

            ./scripts/make_rom.sh --no-rom-zip
            chmod -R 777 out/

      - save_cache:
          key: incremental-out-{{ .Branch }}-{{ checksum "scripts" }}
          paths:
            - out/

      - run:
          name: Prepare Artifacts
          command: |
            mkdir -p /tmp/artifacts
            find out/ -name "*.img" -exec cp {} /tmp/artifacts/ \;
            find out/ -name "*.zip" -exec cp {} /tmp/artifacts/ \; || true

      - store_artifacts:
          path: /tmp/artifacts
          destination: rom_build

workflows:
  build-r8q-workflow:
    jobs:
      - prepare-env
      - build-deps:
          requires:
            - prepare-env
      - extract-firmware:
          requires:
            - prepare-env
      - build-rom:
          requires:
            - build-deps
            - extract-firmware

version: 2.1

executors:
  vm-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      SRC_DIR: /home/circleci/project
      DEBIAN_FRONTEND: noninteractive

jobs:
  prepare-env:
    executor: vm-builder
    steps:
      # Restore apt cache
      - restore_cache:
          key: apt-cache-{{ checksum ".circleci/apt-packages.txt" }}

      - run:
          name: Checkout Code (clean but keep tracked files)
          command: |
            git clone --depth 1 --branch $CIRCLE_BRANCH $CIRCLE_REPOSITORY_URL .
            git submodule sync
            git submodule update --init --recursive --depth 1
            git config --global --add safe.directory "*"

      - run:
          name: Install APT Dependencies on Machine
          command: |
            sudo apt-get update
            xargs -a .circleci/apt-packages.txt sudo apt-get install -yq

      # Apt cache saved ONLY if apt install succeeded
      - save_cache:
          key: apt-cache-{{ checksum ".circleci/apt-packages.txt" }}
          paths:
            - /var/cache/apt
            - /var/lib/apt

      # Persist entire workspace to next job
      - persist_to_workspace:
          root: .
          paths:
            - .

  build-rom:
    executor: vm-builder
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Setup Environment
          command: |
            git config --global user.name "circleci-bot"
            git config --global user.email "bot@example.com"
            sed -i "s/ANDROID_TOOLS_USE_BUNDLED_FMT=OFF/ANDROID_TOOLS_USE_BUNDLED_FMT=ON/g" scripts/build_dependencies.sh
            source ./buildenv.sh r8q

      - run:
          name: Build ROM (Fresh)
          no_output_timeout: 90m
          command: |
            ./scripts/build_dependencies.sh
            ./scripts/download_fw.sh
            ./scripts/extract_fw.sh
            ./scripts/make_rom.sh --no-rom-zip
            chmod -R 777 out/

      # This only saves if ROM build succeeds
      - save_cache:
          key: build-cache-{{ .Revision }}
          paths:
            - out/

      - run:
          name: Prepare Artifacts
          command: |
            mkdir -p /tmp/artifacts
            find out/ -name "*.img" -exec cp {} /tmp/artifacts/ \;
            find out/ -name "*.zip" -exec cp {} /tmp/artifacts/ \; || true

      - store_artifacts:
          path: /tmp/artifacts
          destination: rom_build

workflows:
  build-r8q-workflow:
    jobs:
      - prepare-env
      - build-rom:
          requires:
            - prepare-env

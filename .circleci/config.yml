version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:24.04
    resource_class: large

    environment:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # --- PRECHECKOUT: install git + ssh for real checkout ---
      - run:
          name: Install Git & SSH (required for checkout)
          command: |
            apt-get update
            apt-get install -y git openssh-client

      # --- FAST CHECKOUT ---
      - run:
          name: Checkout (shallow, faster)
          command: |
            git clone --depth=1 --branch "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL" .
            git submodule update --init --recursive --depth 1 || true

      # --- INSTALL BUILD ENVIRONMENT ---
      - run:
          name: Set up build environment
          command: |
            apt-get update
            apt-get install -yq \
              7zip attr ccache clang ffmpeg \
              libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
              libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
              curl unzip wget python3 python3-venv openjdk-17-jdk

            # Optional: kernel modules might not load inside Docker; ignore failures
            modprobe erofs || true
            modprobe f2fs || true

            git config --global user.name "circleci-bot"
            git config --global user.email "bot@example.com"

      # --- BUILD DEPENDENCIES ---
      - run:
          name: Build dependencies
          command: |
            source ./buildenv.sh r8q
            ./scripts/build_dependencies.sh

      # --- DOWNLOAD FIRMWARE ---
      - run:
          name: Download stock firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/download_fw.sh

      # --- EXTRACT FIRMWARE ---
      - run:
          name: Extract firmware
          command: |
            source ./buildenv.sh r8q
            ./scripts/extract_fw.sh

      # --- BUILD ROM ---
      - run:
          name: Build ROM
          no_output_timeout: 90m
          command: |
            source ./buildenv.sh r8q
            ./scripts/make_rom.sh --no-rom-zip

      # --- SAVE BUILD OUTPUT ---
      - store_artifacts:
          path: out/
          destination: rom_output

workflows:
  build-workflow:
    jobs:
      - build
